<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dunkles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap">
<style>
:root{--bg:#F4F8F5;--surface:#fff;--ink:#0A2A20;--muted:#5E7268;--brand:#063628;--on-brand:#fff;--soft:#E2EDE5;--line:#D5E1D8;--logo:none;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08140F;--surface:#102319;--ink:#E8F2EC;--muted:#8FA69A;--brand:#CFE9D6;--on-brand:#08140F;--soft:#17301F;--line:#22392C;--logo:brightness(0) invert(.92);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08140F;--surface:#102319;--ink:#E8F2EC;--muted:#8FA69A;--brand:#CFE9D6;--on-brand:#08140F;--soft:#17301F;--line:#22392C;--logo:brightness(0) invert(.92);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.mark{width:30px;height:30px;filter:var(--logo)}
.pill{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:14px;font-weight:500}
.pill svg{width:16px;height:16px}
#chat{flex:1;overflow-y:auto;padding:8px 18px 16px}
#hero{padding-top:6vh}
.hero-mark{width:76px;height:76px;filter:var(--logo);animation:spin 48s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(32px,9vw,44px);line-height:1.05;letter-spacing:-.03em;font-weight:600;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:34ch}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 2px;border-bottom:1px solid var(--line)}
.row b{font-weight:500;display:block}
.row small{color:var(--muted);font-size:14px}
.row .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.row:hover .ic{background:var(--brand);color:var(--on-brand)}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;margin:0 0 10px;width:fit-content;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:6px}
.msg.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg small{display:block;opacity:.75;font-size:13px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
#tray{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px}
#tray span{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;max-width:100%}
#tray button{width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
#tray svg{width:14px;height:14px}
.composer{display:flex;align-items:flex-end;gap:8px;margin:10px 14px 14px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:28px}
.composer textarea{flex:1;border:0;background:none;resize:none;font:inherit;color:inherit;padding:9px 4px;max-height:120px;outline-offset:0}
.composer textarea::placeholder{color:var(--muted)}
.cbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
#plus{background:var(--soft)}
#go{background:var(--brand);color:var(--on-brand)}
.sheet{position:fixed;inset:0;background:rgba(5,20,14,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.panel{width:100%;max-width:680px;background:var(--surface);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{font-size:18px;margin:0 0 6px;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 10px;border-radius:14px}
.opt:hover,.opt[aria-checked="true"]{background:var(--soft)}
.opt span{flex:1}.opt small{display:block;color:var(--muted);font-size:14px}
.opt .tick{opacity:0}.opt[aria-checked="true"] .tick{opacity:1}
#voice{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px))}
#voice.open{display:flex}
.orb{width:min(62vw,260px);aspect-ratio:1;filter:var(--logo);transition:transform .4s}
.orb img{width:100%;height:100%;animation:spin 30s linear infinite}
#voice[data-s="listening"] .orb{animation:pulse 1.6s ease-in-out infinite}
#voice[data-s="thinking"] .orb img{animation-duration:3s}
#voice[data-s="speaking"] .orb{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#vstat{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
#vtext{color:var(--muted);min-height:4.5em;max-width:32ch;margin:8px auto 0}
.vmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;width:100%}
#vclose{display:flex;align-items:center;gap:8px;padding:14px 26px;border-radius:99px;background:var(--brand);color:var(--on-brand);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <div><p id="vstat">Dinliyorum…</p><p id="vtext"></p></div>
  </div>
  <button id="vclose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>Bitir</button>
</div>

<script>
var $=function(s){return document.querySelector(s)};
var ICON_SEND='<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
var ICON_WAVE='<svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>';
var MODELS=[["Normal","Günlük sorular, hızlı yanıt"],["Yüksek","Daha dikkatli düşünür"],["Maksimum","Zor ödevler ve uzun metinler"],["Ekstra yüksek","En derin analiz, biraz daha yavaş"]];
var level=0,files=[],inp=$("#inp"),go=$("#go");

function sheet(id,on){$(id).classList.toggle("open",on)}
document.querySelectorAll(".sheet").forEach(function(s){s.addEventListener("click",function(e){if(e.target===s)s.classList.remove("open")})});

function renderModels(){
  $("#models").innerHTML="";
  MODELS.forEach(function(m,i){
    var b=document.createElement("button");b.className="opt";b.setAttribute("role","radio");b.setAttribute("aria-checked",i===level);
    b.innerHTML="<span>"+m[0]+"<small>"+m[1]+"</small></span><svg class=\"tick\" viewBox=\"0 0 24 24\"><path d=\"m5 12 5 5 9-10\"/></svg>";
    b.onclick=function(){level=i;$("#modelName").textContent=m[0];renderModels();sheet("#modelSheet",false)};
    $("#models").appendChild(b);
  });
}
renderModels();
$("#modelBtn").onclick=function(){sheet("#modelSheet",true)};
$("#plus").onclick=function(){sheet("#attachSheet",true)};
document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){sheet("#attachSheet",false);$("#"+b.dataset.f).click()}});
["fImg","fVid","fDoc"].forEach(function(id){$("#"+id).onchange=function(e){
  for(var i=0;i<e.target.files.length;i++)files.push(e.target.files[i].name);
  e.target.value="";renderTray();sync();
}});
function renderTray(){
  var t=$("#tray");t.innerHTML="";
  files.forEach(function(n,i){
    var s=document.createElement("span");s.appendChild(document.createTextNode(n));
    var x=document.createElement("button");x.setAttribute("aria-label","Kaldır");x.innerHTML="<svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg>";
    x.onclick=function(){files.splice(i,1);renderTray();sync()};
    s.appendChild(x);t.appendChild(s);
  });
}
function sync(){
  var has=inp.value.trim()||files.length;
  go.innerHTML=has?ICON_SEND:ICON_WAVE;go.setAttribute("aria-label",has?"Gönder":"Sesli sohbet");
  inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,120)+"px";
}
inp.oninput=sync;sync();
inp.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(inp.value.trim()||files.length)send()}};
go.onclick=function(){if(inp.value.trim()||files.length)send();else openVoice()};

document.querySelectorAll(".row").forEach(function(r){r.onclick=function(){
  var a=r.dataset.act;
  if(a==="fill"){inp.value=r.dataset.text;sync();inp.focus()}
  else if(a==="file")$("#fDoc").click();
  else openVoice();
}});

function addMsg(who,text,note){
  $("#hero").style.display="none";
  var d=document.createElement("div");d.className="msg "+who;d.textContent=text;
  if(note){var s=document.createElement("small");s.textContent=note;d.appendChild(s)}
  $("#msgs").appendChild(d);$("#chat").scrollTop=$("#chat").scrollHeight;return d;
}
function mock(t){
  t=t.toLowerCase();
  if(t.indexOf("şarkı")>-1)return "Tabii, dinleme geçmişine bakıyorum ve yeni bir şarkı öneriyorum. (Demo: Spotify bağlantısı sonraki adımda eklenecek.)";
  if(t.indexOf("görsel")>-1)return "Hemen bir görsel hazırlıyorum. (Demo: görsel üretimi sonraki adımda eklenecek.)";
  return "Bu bir demo yanıtı. Gerçek yapay zekâ bağlantısı sonraki adımda eklenecek.";
}
function send(){
  var t=inp.value.trim(),f=files.slice();
  addMsg("user",t||"Dosya gönderdim",f.length?f.join(", "):"");
  inp.value="";files=[];renderTray();sync();
  var d=addMsg("ai","");d.innerHTML="<span class=\"dots\"><i></i><i></i><i></i></span>";
  ask(t||"Dosya gönderdim",function(s){d.textContent=s;$("#chat").scrollTop=$("#chat").scrollHeight}).then(function(s){d.textContent=s+(f.length?" ("+f.length+" dosya alındı, dosya okuma yakında.)":"")});
}

/* dunkles sunucusu: kullanıcı anahtar girmez, her şey sunucuda */
var hist=[],DEV=(function(){try{var k=localStorage.getItem("dk");if(!k){k=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("dk",k)}return k}catch(e){return "anon"}})();
async function ask(text,onChunk){
  var out="";
  try{
    var r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist.concat([{role:"user",content:text}]),level:level,device:DEV})});
    if(!r.ok){var j={};try{j=await r.json()}catch(e){}if(r.status===404||r.status===405)throw new TypeError("sunucu yok");return j.error||"Bir hata oldu, biraz sonra tekrar dene."}
    var rd=r.body.getReader(),dc=new TextDecoder();
    for(;;){var x=await rd.read();if(x.done)break;out+=dc.decode(x.value,{stream:true});if(onChunk)onChunk(out)}
    hist.push({role:"user",content:text},{role:"assistant",content:out});hist=hist.slice(-12);
    return out||"Cevap boş geldi, tekrar dene.";
  }catch(e){return mock(text)+" (Demo: dunkles sunucusu bağlı değil.)"}
}

/* Sesli sohbet */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,vOpen=false;
function setS(s,txt){$("#voice").dataset.s=s;$("#vstat").textContent=txt}
function openVoice(){vOpen=true;$("#voice").classList.add("open");$("#vtext").textContent="";listen()}
function closeVoice(){vOpen=false;$("#voice").classList.remove("open");try{rec&&rec.abort()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function listen(){
  try{speechSynthesis.cancel()}catch(e){}
  if(!SR){setS("idle","Ses tanıma yok");$("#vtext").textContent="Bu tarayıcı sesli girişi desteklemiyor. Chrome ya da Safari dene.";return}
  rec=new SR();rec.lang="tr-TR";rec.interimResults=true;
  setS("listening","Dinliyorum…");
  rec.onresult=function(e){
    var t="",fin=false;
    for(var i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;fin=e.results[i].isFinal}
    $("#vtext").textContent=t;if(fin)heard(t);
  };
  rec.onerror=function(e){if(e.error!=="no-speech"&&e.error!=="aborted"){setS("idle","Mikrofon kapalı");$("#vtext").textContent="Mikrofon iznini açıp küreye dokun."}};
  try{rec.start()}catch(e){}
}
function heard(t){
  try{rec.abort()}catch(e){}
  setS("thinking","Düşünüyor…");addMsg("user",t);
  ask(t).then(function(r){
    addMsg("ai",r);$("#vtext").textContent=r;
    if(!window.speechSynthesis){listen();return}
    var u=new SpeechSynthesisUtterance(r);u.lang="tr-TR";
    u.onend=function(){if(vOpen)listen()};
    setS("speaking","Konuşuyor…");speechSynthesis.speak(u);
  });
}
$("#orb").onclick=listen;$("#vclose").onclick=closeVoice;
</script>
